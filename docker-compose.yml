services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bodeguero
      POSTGRES_PASSWORD: bodeguero
      POSTGRES_DB: bodeguero
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodeguero -d bodeguero"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Offline path: chunk + embed + upsert. Runs once and exits.
  worker:
    build: .
    command: ["python", "-m", "bodeguero.worker", "ingest"]
    env_file: .env
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql://bodeguero:bodeguero@db:5432/bodeguero
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Online path: FastAPI + Telegram webhook.
  api:
    build: .
    env_file: .env
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql://bodeguero:bodeguero@db:5432/bodeguero
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_completed_successfully

volumes:
  pgdata:
